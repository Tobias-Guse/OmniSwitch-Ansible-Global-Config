- name: OmniSwitch Status Check
  hosts: all
  gather_facts: false

  tasks:

    - name: Show VLAN
      ansible.netcommon.cli_command:
        command: show vlan
      register: vlan_output

    - name: Show VLAN Members
      ansible.netcommon.cli_command:
        command: show vlan members
      register: vlan_members_output

    - name: Show Health
      ansible.netcommon.cli_command:
        command: show health
      register: health_output

    - name: Show Interface Status
      ansible.netcommon.cli_command:
        command: show interfaces status
      register: interface_output

    - name: Show System
      ansible.netcommon.cli_command:
        command: show system
      register: system_output

    - name: Display VLAN
      debug:
        msg: "{{ vlan_output.stdout }}"

    - name: Display VLAN Members
      debug:
        msg: "{{ vlan_members_output.stdout }}"

    - name: Display Health
      debug:
        msg: "{{ health_output.stdout }}"

    - name: Display Interface Status
      debug:
        msg: "{{ interface_output.stdout }}"

    - name: Display System
      debug:
        msg: "{{ system_output.stdout }}"
